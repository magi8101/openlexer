<script type="module">

        * {

            color: #00d4ff;
        }
        
        #loading p {
            font-size: 1.2rem;
            color: #888;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        #openlexer_canvas {
