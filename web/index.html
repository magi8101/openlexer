<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLexer - Lexer & Parser Generator</title>
    <link data-trunk rel="rust" data-bin="openlexer-gui" data-cargo-features="gui" data-preload="false"
        href="../Cargo.toml" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 1000;
        }

        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #00d4ff;
        }

        #loading p {
            font-size: 1.2rem;
            color: #888;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #openlexer_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>

    <!-- Service Worker Cleanup & Iframe Patcher -->
    <script>
        // 1. Force Unregister all Service Workers (Cleanup legacy COI worker)
        if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    console.log("[Cleanup] Unregistering Service Worker:", registration);
                    registration.unregister();
                }
            });
        }

        // 2. Aggressive Iframe Patcher (Proxy document.createElement)
        // The MutationObserver was too slow (race condition). 
        // We intercept the creation of the iframe element itself.
        const originalCreateElement = document.createElement;
        document.createElement = function (tagName, options) {
            const element = originalCreateElement.call(document, tagName, options);
            if (tagName.toLowerCase() === 'iframe') {
                console.log("[Security] Intercepted iframe creation - forcing 'credentialless'");
                element.setAttribute('credentialless', '');
            }
            return element;
        };
    </script>


    <script>
 

        // --- Shared State ---
        let _runResults = {};
        let _runCounter = 0;

        function startCodeRun(language, code, testInput, extraCode = "") {
            const id = ++_runCounter;
            _runResults[id] = { done: false, output: '' };

            // Execute async to not block UI
            (async () => {
                try {
                    let result = "";
                    if (language === 'python') {
                        result = await runPython(code, testInput, extraCode);
                    } else if (language === 'c') {
                        result = await runC(code, testInput);
                    } else if (language === 'java') {
                        result = await runJava(code, testInput);
                    } else {
                        throw new Error("Unknown language: " + language);
                    }
                    _runResults[id] = { done: true, output: result };
                } catch (e) {
                    console.error(e);
                    _runResults[id] = { done: true, output: '[Error] ' + e.message };
                }
            })();

            return id;
        }

        function isRunDone(id) {
            return _runResults[id] ? _runResults[id].done : true;
        }

        function getRunResult(id) {
            const r = _runResults[id];
            if (r) { const output = r.output; delete _runResults[id]; return output; }
            return '';
        }

        // --- Execution: Wandbox, called directly from the browser (no proxy) ---
        // Wandbox's public API sets Access-Control-Allow-Origin: *, so it can be
        // called straight from client-side JS - no backend needed just to get
        // around CORS. https://github.com/melpon/wandbox/blob/master/kennel2/API.rst
        const WANDBOX_URL = "https://wandbox.org/api/compile.json";

        async function runOnWandbox(compiler, files, stdin) {
            try {
                const body = { compiler, stdin: stdin || "" };
                if (files.length > 1) {
                    body.code = "";
                    body.codes = files.map(f => ({ file: f.name, code: f.content }));
                } else {
                    body.code = files[0].content;
                }

                const response = await fetch(WANDBOX_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    throw new Error(`Wandbox API Error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                let output = "";

                if (result.compiler_error) {
                    output += "[Compiler Error]\n" + result.compiler_error + "\n";
                }
                if (result.status !== "0") {
                    output += `[Runtime Error (Exit Code: ${result.status})]\n`;
                }
                if (result.program_error) {
                    output += result.program_error + "\n";
                }
                output += result.program_message || "";
                return output;
            } catch (e) {
                return `Execution Error: ${e.message}\n(Check internet connection)`;
            }
        }

        // --- Python ---
        async function runPython(code, testInput, extraCode = "") {
            const files = [{ name: "main.py", content: code }];
            if (extraCode && extraCode.trim().length > 0) {
                files.push({ name: "lexer.py", content: extraCode });
            }
            return runOnWandbox("cpython-3.11.10", files, testInput);
        }

        // --- C ---
        async function runC(code, testInput) {
            return runOnWandbox("gcc-13.2.0-c", [{ name: "main.c", content: code }], testInput);
        }

        // --- Java ---
        async function runJava(code, testInput) {
            // Pick a sensible source filename from code content - Java requires
            // the file to be named after its public class.
            let javaFileName = "Main.java";
            const publicClassMatch = code.match(/public\s+class\s+([A-Za-z_][A-Za-z0-9_]*)/);
            if (publicClassMatch && publicClassMatch[1]) {
                javaFileName = `${publicClassMatch[1]}.java`;
            } else if (/\bclass\s+Parser\b/.test(code) && !/\bclass\s+Lexer\b/.test(code)) {
                javaFileName = "Parser.java";
            } else if (/\bclass\s+Lexer\b/.test(code)) {
                javaFileName = "Lexer.java";
            }
            return runOnWandbox("openjdk-jdk-21+35", [{ name: javaFileName, content: code }], testInput);
        }
    </script>
</head>

<body>
    <canvas id="openlexer_canvas"></canvas>
    <div id="loading">
        <h1>OpenLexer</h1>
        <p>Lexer & Parser Generator</p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;">Flex/Bison replacement for C, Java, Python</p>
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-size: 0.8rem;">Loading WebAssembly...</p>
    </div>
</body>

</html>
