<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLexer - Lexer & Parser Generator</title>
    <link data-trunk rel="rust" data-bin="openlexer-gui" data-cargo-features="gui" href="../Cargo.toml" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 1000;
        }
        
        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #00d4ff;
        }
        
        #loading p {
            font-size: 1.2rem;
            color: #888;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #openlexer_canvas {
            width: 100%;
            height: 100%;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>OpenLexer</h1>
        <p>Lexer & Parser Generator</p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;">Flex/Bison replacement for C, Java, Python</p>
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-size: 0.8rem;">Loading WebAssembly...</p>
    </div>
    
    <canvas id="openlexer_canvas"></canvas>
</body>
</html>
