<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLexer - Lexer & Parser Generator</title>
    <link data-trunk rel="rust" data-bin="openlexer-gui" data-cargo-features="gui" data-preload="false"
        href="../Cargo.toml" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 1000;
        }

        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #00d4ff;
        }

        #loading p {
            font-size: 1.2rem;
            color: #888;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #openlexer_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>

    <!-- Service Worker Cleanup & Iframe Patcher -->
    <script>
        // 1. Force Unregister all Service Workers (Cleanup legacy COI worker)
        if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    console.log("[Cleanup] Unregistering Service Worker:", registration);
                    registration.unregister();
                }
            });
        }

        // 2. Aggressive Iframe Patcher (Proxy document.createElement)
        // The MutationObserver was too slow (race condition). 
        // We intercept the creation of the iframe element itself.
        const originalCreateElement = document.createElement;
        document.createElement = function (tagName, options) {
            const element = originalCreateElement.call(document, tagName, options);
            if (tagName.toLowerCase() === 'iframe') {
                console.log("[Security] Intercepted iframe creation - forcing 'credentialless'");
                element.setAttribute('credentialless', '');
            }
            return element;
        };
    </script>


    <script>
 

        // --- Shared State ---
        let _runResults = {};
        let _runCounter = 0;

        function startCodeRun(language, code, testInput, extraCode = "") {
            const id = ++_runCounter;
            _runResults[id] = { done: false, output: '' };

            // Execute async to not block UI
            (async () => {
                try {
                    let result = "";
                    if (language === 'python') {
                        result = await runPython(code, testInput, extraCode);
                    } else if (language === 'c') {
                        result = await runC(code, testInput);
                    } else if (language === 'java') {
                        result = await runJava(code, testInput);
                    } else {
                        throw new Error("Unknown language: " + language);
                    }
                    _runResults[id] = { done: true, output: result };
                } catch (e) {
                    console.error(e);
                    _runResults[id] = { done: true, output: '[Error] ' + e.message };
                }
            })();

            return id;
        }

        function isRunDone(id) {
            return _runResults[id] ? _runResults[id].done : true;
        }

        function getRunResult(id) {
            const r = _runResults[id];
            if (r) { const output = r.output; delete _runResults[id]; return output; }
            return '';
        }

        // --- Execution: Compiler Explorer (godbolt.org), called directly from
        // the browser (no proxy). Its API sets Access-Control-Allow-Origin: *,
        // so - same as Wandbox before it - no backend is needed just to get
        // around CORS. Switched from Wandbox because its execution sandbox was
        // returning HTTP 500 ("Failed to get uid...", a Podman-level failure
        // on their infrastructure) for every request; Compiler Explorer is
        // more heavily used/maintained infrastructure.
        // https://github.com/compiler-explorer/compiler-explorer/blob/main/docs/API.md
        //
        // One real constraint: the API compiles a single in-memory file per
        // request (no multi-file support like Wandbox's `codes` array), always
        // saved server-side as "example.<ext>" regardless of what we call it.
        async function runOnGodbolt(compilerId, source, stdin) {
            try {
                const response = await fetch(`https://godbolt.org/api/compiler/${compilerId}/compile`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        source,
                        options: {
                            userArguments: "",
                            executeParameters: { args: [], stdin: stdin || "" },
                            compilerOptions: { executorRequest: true },
                            filters: { execute: true }
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Compiler Explorer API Error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                // GCC/Clang diagnostics come back with raw ANSI color escape
                // codes (e.g. compile errors); strip them since this is
                // rendered as plain text, not a terminal.
                const stripAnsi = (s) => s.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, "");
                const join = (lines) => stripAnsi((lines || []).map(l => l.text).join("\n"));
                let output = "";

                if (!result.didExecute) {
                    // Compilation itself failed before execution could start;
                    // the compiler's diagnostics are what's useful here.
                    output += "[Compilation Error]\n";
                    output += join(result.buildResult && result.buildResult.stderr) || join(result.stderr);
                    return output;
                }
                if (result.code !== 0) {
                    output += `[Runtime Error (Exit Code: ${result.code})]\n`;
                    output += join(result.stderr) + "\n";
                }
                output += join(result.stdout);
                return output;
            } catch (e) {
                return `Execution Error: ${e.message}\n(Check internet connection)`;
            }
        }

        // --- Python ---
        async function runPython(code, testInput, extraCode = "") {
            let source = code;
            if (extraCode && extraCode.trim().length > 0) {
                // No multi-file support here (unlike the old backend/Wandbox),
                // so concatenate lexer + parser into one script and drop the
                // now-pointless "from lexer import ..." line - both files'
                // top-level definitions land in the same module namespace
                // either way, so nothing after that needs to change.
                const withoutImport = code.replace(/^\s*(from lexer import .*|import lexer)\s*$/m, "");
                source = extraCode + "\n" + withoutImport;
            }
            return runOnGodbolt("python312", source, testInput);
        }

        // --- C ---
        async function runC(code, testInput) {
            return runOnGodbolt("cg162", code, testInput);
        }

        // --- Java ---
        async function runJava(code, testInput) {
            // Compiler Explorer always saves the source as "example.java"
            // server-side, so a `public class X` (which Java requires to
            // match the filename) fails to compile no matter what we name it
            // in the request. A non-public top-level class has no such
            // requirement, so just drop `public` from the class we're running
            // - safe here since generated Lexer/Parser code declares exactly
            // one top-level class per file.
            const runnable = code.replace(/\bpublic\s+class\b/, "class");
            return runOnGodbolt("java2501", runnable, testInput);
        }
    </script>
</head>

<body>
    <canvas id="openlexer_canvas"></canvas>
    <div id="loading">
        <h1>OpenLexer</h1>
        <p>Lexer & Parser Generator</p>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;">Flex/Bison replacement for C, Java, Python</p>
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-size: 0.8rem;">Loading WebAssembly...</p>
    </div>
</body>

</html>
